<header class="fixed top-0 w-full bg-gray-900/95 backdrop-blur-sm border-b shadow-xl z-50">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">

    <a routerLink="/home" (click)="closeMenu()" class="logo" aria-label="Irvin Herrera – Home">
      IH<span class="accent">.</span>dev
    </a>

    <!-- Desktop navigation -->
    <nav aria-label="Main navigation" class="hidden md:block">
      <ul class="flex gap-8" role="list">
        <li>
          <a routerLink="/home" routerLinkActive="active" class="nav-link">Home</a>
        </li>
        <li>
          <a routerLink="/about" routerLinkActive="active" class="nav-link">About</a>
        </li>
        <li>
          <a routerLink="/projects" routerLinkActive="active" class="nav-link">Personal Projects</a>
        </li>
        <li>
          <a routerLink="/experience" routerLinkActive="active" class="nav-link">Experience</a>
        </li>
        <li>
          <a routerLink="/contact" routerLinkActive="active" class="nav-link">Contact</a>
        </li>
        <li>
          <a routerLink="/news" routerLinkActive="active" class="nav-link nav-link--news">IH Dev News</a>
        </li>
      </ul>
    </nav>

    <!-- Right controls: theme toggle + mobile hamburger -->
    <div class="flex items-center gap-2">

      <button
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.aria-pressed]="!theme.isDark()"
        type="button"
      >
        @if (theme.isDark()) {
          <!-- Sun: currently dark, click to go light -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <!-- Moon: currently light, click to go dark -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <!-- Mobile hamburger -->
      <button
        class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 transition-colors"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-menu"
        aria-label="Toggle navigation menu"
        type="button"
      >
        @if (isMenuOpen()) {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        } @else {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        }
      </button>

    </div>
  </div>

  <!-- Mobile menu -->
  @if (isMenuOpen()) {
    <nav id="mobile-menu" class="md:hidden border-t" aria-label="Mobile navigation">
      <ul class="container mx-auto px-6 py-5 flex flex-col gap-1" role="list">
        <li>
          <a routerLink="/home" routerLinkActive="active" class="nav-link-mobile" (click)="closeMenu()">Home</a>
        </li>
        <li>
          <a routerLink="/about" routerLinkActive="active" class="nav-link-mobile" (click)="closeMenu()">About</a>
        </li>
        <li>
          <a routerLink="/projects" routerLinkActive="active" class="nav-link-mobile" (click)="closeMenu()">Personal Projects</a>
        </li>
        <li>
          <a routerLink="/experience" routerLinkActive="active" class="nav-link-mobile" (click)="closeMenu()">Experience</a>
        </li>
        <li>
          <a routerLink="/contact" routerLinkActive="active" class="nav-link-mobile" (click)="closeMenu()">Contact</a>
        </li>
        <li>
          <a routerLink="/news" routerLinkActive="active" class="nav-link-mobile nav-link--news" (click)="closeMenu()">IH Dev News</a>
        </li>
      </ul>
    </nav>
  }
</header>
