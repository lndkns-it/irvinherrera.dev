<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Irvin Herrera – Senior / Lead Fullstack Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Newspaper page fonts (Bodoni Moda, Archivo Black/Narrow, Spectral) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Archivo+Black&family=Archivo+Narrow:wght@400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
  <!-- Apply saved theme before Angular boots to prevent flash of wrong theme -->
  <script>
    try {
      var s = localStorage.getItem('theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
